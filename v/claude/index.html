<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Clockwork Capybara</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bcd9f0; font-family: Georgia, 'Times New Roman', serif; }
  canvas { display: block; }
  #title { position: fixed; top: 18px; left: 22px; color: #3b2412; text-shadow: 0 1px 0 rgba(255,255,255,.6); pointer-events: none; }
  #title h1 { margin: 0; font-size: 26px; letter-spacing: 1px; }
  #title p { margin: 4px 0 0; font-size: 14px; font-style: italic; opacity: .8; }
  #hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(59,36,18,.75);
          color: #f3e3c3; padding: 8px 18px; border-radius: 20px; font-size: 13px; pointer-events: none; border: 1px solid #c9a04a; white-space: nowrap; }
</style>
</head>
<body>
<div id="title">
  <h1>⚙ The Clockwork Capybara ⚙</h1>
  <p>Captain at the helm, goggles on, mainspring fully wound.</p>
</div>
<div id="hint">Drag to orbit · Right-drag to pan · Scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe2f1, 35, 160);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(9.5, 4.5, 10.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 35;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.addEventListener('start', () => { controls.autoRotate = false; });

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------------------------------------------------------------- sky dome
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(500, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      top:    { value: new THREE.Color(0x3f7fd0) },
      mid:    { value: new THREE.Color(0xbcd9f0) },
      bottom: { value: new THREE.Color(0xffdcb8) },
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 top; uniform vec3 mid; uniform vec3 bottom;
      varying vec3 vDir;
      void main() {
        float h = vDir.y;
        vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.55)) : mix(mid, bottom, pow(-h, 0.45));
        gl_FragColor = vec4(c, 1.0);
        #include <colorspace_fragment>
      }`,
  })
);
scene.add(sky);

// ---------------------------------------------------------------- lights
scene.add(new THREE.HemisphereLight(0xdcefff, 0x8a6a50, 0.6));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6);
sun.position.set(8, 16, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 50 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// ---------------------------------------------------------------- helpers
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const SPH = new THREE.SphereGeometry(1, 32, 24);

function blob(parent, mat, s, p, r) {
  const m = new THREE.Mesh(SPH, mat);
  m.scale.set(...s);
  m.position.set(...p);
  if (r) m.rotation.set(...r);
  parent.add(m);
  return m;
}

function rod(a, b, r, mat, seg = 10) {
  const d = new THREE.Vector3().subVectors(b, a);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), seg), mat);
  m.position.addVectors(a, b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
  return m;
}

function tube(pts, r, mat, closed = false, seg = 128) {
  const curve = new THREE.CatmullRomCurve3(pts, closed);
  return new THREE.Mesh(new THREE.TubeGeometry(curve, seg, r, 8, closed), mat);
}

// Rounded box with smooth normals
function roundedBox(w, h, d, r, seg = 16) {
  const geo = new THREE.BoxGeometry(w, h, d, seg, seg, seg);
  const pos = geo.attributes.position, nor = geo.attributes.normal;
  const hw = w / 2 - r, hh = h / 2 - r, hd = d / 2 - r;
  const v = new THREE.Vector3(), inner = new THREE.Vector3(), n = new THREE.Vector3();
  const cl = THREE.MathUtils.clamp;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    inner.set(cl(v.x, -hw, hw), cl(v.y, -hh, hh), cl(v.z, -hd, hd));
    n.subVectors(v, inner).normalize();
    v.copy(inner).addScaledVector(n, r);
    pos.setXYZ(i, v.x, v.y, v.z);
    nor.setXYZ(i, n.x, n.y, n.z);
  }
  return geo;
}

function makeGearGeo(r, teeth, depth) {
  const shape = new THREE.Shape();
  const root = r * 0.82, step = Math.PI * 2 / teeth;
  for (let i = 0; i < teeth; i++) {
    const a0 = i * step;
    const pts = [[root, a0], [r, a0 + step * 0.15], [r, a0 + step * 0.45], [root, a0 + step * 0.6]];
    pts.forEach(([rad, a], j) => {
      const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
      if (i === 0 && j === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
    });
  }
  shape.closePath();
  const hub = new THREE.Path(); hub.absarc(0, 0, r * 0.12, 0, Math.PI * 2, true); shape.holes.push(hub);
  for (let k = 0; k < 5; k++) {
    const a = k / 5 * Math.PI * 2;
    const h = new THREE.Path();
    h.absarc(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5, r * 0.17, 0, Math.PI * 2, true);
    shape.holes.push(h);
  }
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.01, bevelSegments: 1, curveSegments: 12,
  });
  geo.translate(0, 0, -depth / 2);
  return geo;
}

function makePlankTexture({ planks = 8, base = [140, 88, 48] } = {}) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  const h = 512 / planks;
  for (let i = 0; i < planks; i++) {
    const v = 0.8 + Math.random() * 0.35;
    g.fillStyle = `rgb(${base[0] * v | 0},${base[1] * v | 0},${base[2] * v | 0})`;
    g.fillRect(0, i * h, 512, h);
    for (let k = 0; k < 16; k++) {
      g.strokeStyle = `rgba(45,22,6,${0.06 + Math.random() * 0.12})`;
      g.lineWidth = 0.8 + Math.random() * 1.6;
      const y0 = i * h + 3 + Math.random() * (h - 6), amp = Math.random() * 2.5, fr = 0.01 + Math.random() * 0.03, ph = Math.random() * 6;
      g.beginPath();
      for (let x = 0; x <= 512; x += 8) {
        const y = y0 + Math.sin(x * fr + ph) * amp;
        x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.stroke();
    }
    g.fillStyle = 'rgba(30,14,4,0.85)';
    g.fillRect(0, i * h, 512, 2);                        // seam
    const jx = Math.random() * 512;
    g.fillRect(jx, i * h, 2, h);                         // butt joint
    g.fillStyle = 'rgba(20,10,4,0.7)';
    g.beginPath(); g.arc(jx + 8, i * h + h * 0.3, 2, 0, 7); g.arc(jx + 8, i * h + h * 0.7, 2, 0, 7); g.fill(); // nails
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}

function makeGoreTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const n = 16, w = c.width / n;
  for (let i = 0; i < n; i++) {
    g.fillStyle = i % 2 ? '#ebdfbd' : '#d8c393';
    g.fillRect(i * w, 0, w, c.height);
  }
  for (let k = 0; k < 7000; k++) {
    g.fillStyle = `rgba(90,60,30,${Math.random() * 0.06})`;
    g.fillRect(Math.random() * 1024, Math.random() * 512, 2, 2);
  }
  for (let k = 0; k < 6; k++) {   // patches
    const x = Math.random() * 980, y = 120 + Math.random() * 260;
    g.fillStyle = '#c4a671'; g.fillRect(x, y, 40, 30);
    g.strokeStyle = 'rgba(80,50,25,.7)'; g.lineWidth = 1; g.setLineDash([3, 3]);
    g.strokeRect(x + 3, y + 3, 34, 24); g.setLineDash([]);
  }
  for (let i = 0; i < n; i++) {   // seams + stitching
    g.strokeStyle = 'rgba(90,60,30,.6)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(i * w, 0); g.lineTo(i * w, 512); g.stroke();
    g.lineWidth = 1; g.setLineDash([6, 6]);
    g.beginPath(); g.moveTo(i * w + 6, 0); g.lineTo(i * w + 6, 512); g.stroke();
    g.setLineDash([]);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function makePropeller(len, n, mat) {
  const g = new THREE.Group();
  const hub = new THREE.Mesh(SPH, M.brass); hub.scale.setScalar(len * 0.15); g.add(hub);
  for (let i = 0; i < n; i++) {
    const arm = new THREE.Group();
    arm.rotation.x = i / n * Math.PI * 2;
    const blade = new THREE.Mesh(SPH, mat);
    blade.scale.set(0.025, len * 0.5, len * 0.13);
    blade.position.y = len * 0.55;
    blade.rotation.y = 0.55;
    arm.add(blade);
    const band = new THREE.Mesh(SPH, M.brass);
    band.scale.set(0.03, len * 0.04, len * 0.12);
    band.position.y = len * 0.9;
    band.rotation.y = 0.55;
    arm.add(band);
    g.add(arm);
  }
  return g;
}

// ---------------------------------------------------------------- materials
const M = {
  wood:     new THREE.MeshStandardMaterial({ color: 0xa26a3a, roughness: 0.7 }),
  darkWood: new THREE.MeshStandardMaterial({ color: 0x5a371c, roughness: 0.8 }),
  brass:    new THREE.MeshStandardMaterial({ color: 0xd0a348, metalness: 1, roughness: 0.3 }),
  copper:   new THREE.MeshStandardMaterial({ color: 0xc4774a, metalness: 1, roughness: 0.35 }),
  iron:     new THREE.MeshStandardMaterial({ color: 0x3a3a3f, metalness: 0.8, roughness: 0.45 }),
  rope:     new THREE.MeshStandardMaterial({ color: 0xc9b086, roughness: 1 }),
  fur:      new THREE.MeshStandardMaterial({ color: 0x8d5d37, roughness: 0.95 }),
  furDark:  new THREE.MeshStandardMaterial({ color: 0x5e3b20, roughness: 0.95 }),
  nose:     new THREE.MeshStandardMaterial({ color: 0x2e1d12, roughness: 0.55 }),
  black:    new THREE.MeshStandardMaterial({ color: 0x0b0806, roughness: 0.2 }),
  leather:  new THREE.MeshStandardMaterial({ color: 0x4a2c17, roughness: 0.65, side: THREE.DoubleSide }),
  tooth:    new THREE.MeshStandardMaterial({ color: 0xf3e8cf, roughness: 0.4 }),
  scarf:    new THREE.MeshStandardMaterial({ color: 0xb8312a, roughness: 0.85, side: THREE.DoubleSide }),
  glass:    new THREE.MeshPhysicalMaterial({ color: 0xa8dcf0, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.35, clearcoat: 1 }),
  porthole: new THREE.MeshStandardMaterial({ color: 0x223344, metalness: 0.6, roughness: 0.15 }),
  glow:     new THREE.MeshStandardMaterial({ color: 0xffc870, emissive: 0xffa940, emissiveIntensity: 2.5 }),
};

// ---------------------------------------------------------------- airship
const ship = new THREE.Group();
scene.add(ship);
const gears = [];
const props = [];

// Hull: lower half-ellipsoid of planks
const HA = 3.2, HB = 1.0, HC = 1.3;
const hull = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 24, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
  new THREE.MeshStandardMaterial({ map: makePlankTexture({ planks: 9, base: [140, 88, 48] }), roughness: 0.7, side: THREE.DoubleSide })
);
hull.scale.set(HA, HB, HC);
ship.add(hull);

const deckY = -0.12;
const df = Math.sqrt(1 - deckY * deckY);
const deck = new THREE.Mesh(
  new THREE.CircleGeometry(1, 64),
  new THREE.MeshStandardMaterial({ map: makePlankTexture({ planks: 12, base: [170, 122, 76] }), roughness: 0.8 })
);
deck.rotation.x = -Math.PI / 2;
deck.scale.set(HA * df, HC * df, 1);
deck.position.y = deckY;
ship.add(deck);

// gunwale + keel
const rimPts = [];
for (let i = 0; i < 72; i++) { const t = i / 72 * Math.PI * 2; rimPts.push(V(Math.cos(t) * HA * 1.005, 0, Math.sin(t) * HC * 1.005)); }
ship.add(tube(rimPts, 0.06, M.darkWood, true, 180));
const keelPts = [];
for (let i = 0; i <= 40; i++) { const t = i / 40 * Math.PI; keelPts.push(V(Math.cos(t) * HA * 1.01, -Math.sin(t) * HB * 1.01, 0)); }
ship.add(tube(keelPts, 0.05, M.brass, false, 80));

// bow spike
const spike = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.55, 16), M.brass);
spike.rotation.z = -Math.PI / 2; spike.position.set(HA + 0.22, 0, 0); ship.add(spike);

function hullSurface(x, y, side) {
  const k = 1 - (x * x) / (HA * HA) - (y * y) / (HB * HB);
  const z = side * HC * Math.sqrt(Math.max(k, 0));
  return { p: V(x, y, z), n: V(x / (HA * HA), y / (HB * HB), z / (HC * HC)).normalize() };
}
function attachToHull(obj, x, y, side, offset = 0) {
  const { p, n } = hullSurface(x, y, side);
  obj.position.copy(p).addScaledVector(n, offset);
  obj.quaternion.setFromUnitVectors(V(0, 0, 1), n);
  ship.add(obj);
  return obj;
}

// portholes
for (const side of [1, -1]) for (const x of [1.15, 1.95]) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.035, 10, 28), M.brass));
  const gl = new THREE.Mesh(new THREE.CircleGeometry(0.13, 24), M.porthole); gl.position.z = -0.01; g.add(gl);
  attachToHull(g, x, -0.35, side, 0.01);
}

// clockwork gear train on both flanks (meshing ratios)
function addHullGear(x, y, side, r, teeth, speed, mat) {
  const g = new THREE.Group();
  const gear = new THREE.Mesh(makeGearGeo(r, teeth, 0.06), mat);
  gear.position.z = 0.03;
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.14, r * 0.14, 0.14, 16), M.iron);
  axle.rotation.x = Math.PI / 2; axle.position.z = 0.04;
  g.add(gear, axle);
  attachToHull(g, x, y, side, 0.02);
  gears.push({ mesh: gear, speed: speed * side });
}
const GW = 0.9;
for (const side of [1, -1]) {
  addHullGear(-0.6, -0.38, side, 0.36, 18, GW, M.brass);
  addHullGear(-0.07, -0.31, side, 0.23, 11, -GW * 18 / 11, M.copper);
  addHullGear(-1.14, -0.25, side, 0.25, 12, -GW * 18 / 12, M.copper);
}

// outrigger propellers
for (const side of [1, -1]) {
  const z1 = side * 2.05;
  ship.add(rod(V(-0.3, -0.02, side * 1.22), V(-0.3, -0.02, z1), 0.045, M.brass));
  ship.add(rod(V(0.2, -0.3, side * 1.2), V(-0.3, -0.02, z1 * 0.97), 0.03, M.brass));
  const nac = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.08, 0.55, 16), M.copper);
  nac.rotation.z = Math.PI / 2; nac.position.set(-0.3, -0.02, z1); ship.add(nac);
  blob(ship, M.copper, [0.11, 0.11, 0.11], [-0.02, -0.02, z1]);
  const p = makePropeller(0.5, 3, M.wood);
  p.position.set(-0.62, -0.02, z1);
  ship.add(p);
  props.push({ obj: p, speed: 14 * side });
}

// envelope
const EY = 3.45, EA = 4.2, ER = 1.5;
const envGeo = new THREE.SphereGeometry(1, 64, 32);
envGeo.rotateZ(Math.PI / 2);
const env = new THREE.Mesh(envGeo, new THREE.MeshStandardMaterial({ map: makeGoreTexture(), roughness: 0.85 }));
env.scale.set(EA, ER, ER);
env.position.y = EY;
ship.add(env);

// wooden battens
for (let i = 0; i < 10; i++) {
  const a = i / 10 * Math.PI * 2, pts = [];
  for (let j = 0; j <= 40; j++) {
    const t = 0.06 * Math.PI + j / 40 * 0.88 * Math.PI;
    const r = ER * 1.012 * Math.sin(t);
    pts.push(V(EA * 1.012 * Math.cos(t), EY + r * Math.cos(a), r * Math.sin(a)));
  }
  ship.add(tube(pts, 0.035, M.darkWood, false, 80));
}
// brass hoops
for (const x of [-2.8, -1.4, 0, 1.4, 2.8]) {
  const r = ER * Math.sqrt(1 - (x / EA) ** 2) * 1.02;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.045, 10, 72), M.brass);
  ring.rotation.y = Math.PI / 2; ring.position.set(x, EY, 0);
  ship.add(ring);
}
// nose cap
blob(ship, M.brass, [0.2, 0.2, 0.2], [EA - 0.05, EY, 0]);
const noseSpike = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.4, 16), M.brass);
noseSpike.rotation.z = -Math.PI / 2; noseSpike.position.set(EA + 0.3, EY, 0); ship.add(noseSpike);

// tail cone + main propeller
const tailCone = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.55, 24), M.brass);
tailCone.rotation.z = Math.PI / 2; tailCone.position.set(-EA - 0.12, EY, 0); ship.add(tailCone);
ship.add(rod(V(-EA - 0.3, EY, 0), V(-EA - 0.85, EY, 0), 0.04, M.iron));
const tailProp = makePropeller(0.95, 4, M.wood);
tailProp.position.set(-EA - 0.82, EY, 0);
ship.add(tailProp);
props.push({ obj: tailProp, speed: 9 });

// tail fins (+ configuration); base follows envelope contour
const finShape = new THREE.Shape();
finShape.moveTo(0.7, 1.15);
finShape.lineTo(-1.0, 0.28);
finShape.lineTo(-1.35, 2.1);
finShape.quadraticCurveTo(-0.7, 2.25, -0.3, 1.95);
finShape.lineTo(0.7, 1.15);
const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.06, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 2 });
finGeo.translate(0, 0, -0.03);
const finMat = new THREE.MeshStandardMaterial({ map: makePlankTexture({ planks: 5, base: [130, 82, 44] }), roughness: 0.75 });
for (let i = 0; i < 4; i++) {
  const piv = new THREE.Group();
  piv.position.set(-3.1, EY, 0);
  piv.rotation.x = i * Math.PI / 2;
  piv.add(new THREE.Mesh(finGeo, finMat));
  ship.add(piv);
}

// giant wind-up key on top
const key = new THREE.Group();
key.position.set(0.4, EY + ER * Math.sqrt(1 - (0.4 / EA) ** 2) - 0.03, 0);
ship.add(key);
const kShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.5, 16), M.brass); kShaft.position.y = 0.25; key.add(kShaft);
const kCollar = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.17, 0.07, 24), M.brass); kCollar.position.y = 0.03; key.add(kCollar);
const kPlate = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.12, 0.05), M.brass); kPlate.position.y = 0.55; key.add(kPlate);
for (const s of [1, -1]) {
  const loop = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.045, 12, 32), M.brass);
  loop.position.set(s * 0.2, 0.7, 0);
  key.add(loop);
}

// rigging + struts
function envPoint(x, ang, side) {
  const R = ER * Math.sqrt(Math.max(0, 1 - (x / EA) ** 2));
  return V(x, EY - R * Math.cos(ang), side * R * Math.sin(ang));
}
function rimPoint(x, side) { return V(x, 0.02, side * HC * Math.sqrt(Math.max(0, 1 - (x / HA) ** 2))); }
for (const side of [1, -1]) {
  for (const x of [-2.4, -1.2, 0, 1.2, 2.4]) ship.add(rod(rimPoint(x, side), envPoint(x * 1.2, 0.55, side), 0.012, M.rope, 6));
  for (const x of [-1.8, 0.6]) ship.add(rod(rimPoint(x, side), envPoint(x + 1.2, 0.55, side), 0.01, M.rope, 6));
  for (const x of [-1.6, 1.6]) ship.add(rod(rimPoint(x, side), envPoint(x, 0.35, side), 0.05, M.darkWood));
}

// clockwork engine on the stern deck
const engine = new THREE.Group();
engine.position.set(-1.65, deckY, 0);
ship.add(engine);
const eBox = new THREE.Mesh(roundedBox(0.8, 0.55, 0.75, 0.05, 6), M.darkWood); eBox.position.y = 0.275; engine.add(eBox);
const eTrim = new THREE.Mesh(new THREE.BoxGeometry(0.84, 0.05, 0.79), M.brass); eTrim.position.y = 0.53; engine.add(eTrim);
function addFlatGear(parent, x, z, r, teeth, speed, mat) {
  const g = new THREE.Group();
  g.position.set(x, 0.59, z);
  g.rotation.x = -Math.PI / 2;
  const gear = new THREE.Mesh(makeGearGeo(r, teeth, 0.05), mat);
  g.add(gear);
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.12, 12), M.iron);
  pin.rotation.x = Math.PI / 2; g.add(pin);
  parent.add(g);
  gears.push({ mesh: gear, speed });
}
addFlatGear(engine, 0.05, 0.1, 0.2, 11, 1.6, M.brass);
addFlatGear(engine, -0.15, -0.15, 0.15, 8, -1.6 * 11 / 8, M.copper);
// pressure gauge
const gauge = new THREE.Group(); gauge.position.set(0.41, 0.3, 0); gauge.rotation.y = Math.PI / 2; engine.add(gauge);
gauge.add(new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.02, 8, 24), M.brass));
const face = new THREE.Mesh(new THREE.CircleGeometry(0.1, 24), new THREE.MeshStandardMaterial({ color: 0xf2e6c8, roughness: 0.6 }));
gauge.add(face);
const needle = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.08, 0.01), M.black);
needle.geometry.translate(0, 0.04, 0); needle.position.z = 0.01; gauge.add(needle);

// cargo
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.42, 20), M.wood);
barrel.position.set(-2.45, deckY + 0.21, 0.35); ship.add(barrel);
for (const y of [-0.13, 0.13]) {
  const b = new THREE.Mesh(new THREE.TorusGeometry(0.175, 0.012, 6, 24), M.iron);
  b.rotation.x = Math.PI / 2; b.position.set(-2.45, deckY + 0.21 + y, 0.35); ship.add(b);
}
const crate = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.34, 0.34), new THREE.MeshStandardMaterial({ map: makePlankTexture({ planks: 4, base: [175, 130, 80] }) }));
crate.position.set(-2.4, deckY + 0.17, -0.35); crate.rotation.y = 0.3; ship.add(crate);

// ship's wheel
ship.add(rod(V(1.97, deckY, 0), V(1.97, 0.35, 0), 0.06, M.darkWood));
const wheel = new THREE.Group();
wheel.position.set(1.88, 0.35, 0);
ship.add(wheel);
const wRim = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.03, 10, 48), M.wood); wRim.rotation.y = Math.PI / 2; wheel.add(wRim);
const wHub = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.12, 16), M.brass); wHub.rotation.z = Math.PI / 2; wheel.add(wHub);
for (let i = 0; i < 8; i++) {
  const a = i / 8 * Math.PI * 2;
  wheel.add(rod(V(0, 0, 0), V(0, Math.cos(a) * 0.44, Math.sin(a) * 0.44), 0.018, M.wood, 6));
  blob(wheel, M.wood, [0.03, 0.03, 0.03], [0, Math.cos(a) * 0.45, Math.sin(a) * 0.45]);
}

// bow lantern
ship.add(rod(V(2.55, deckY, 0), V(2.55, 0.95, 0), 0.035, M.iron));
ship.add(rod(V(2.55, 0.95, 0), V(2.9, 0.95, 0), 0.025, M.iron));
ship.add(rod(V(2.9, 0.95, 0), V(2.9, 0.8, 0), 0.01, M.iron));
const lantern = new THREE.Group(); lantern.position.set(2.9, 0.7, 0); ship.add(lantern);
for (const y of [-0.1, 0.1]) {
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.04, 16), M.brass);
  cap.position.y = y; lantern.add(cap);
}
for (let i = 0; i < 4; i++) {
  const a = i / 4 * Math.PI * 2 + Math.PI / 4;
  lantern.add(rod(V(Math.cos(a) * 0.08, -0.1, Math.sin(a) * 0.08), V(Math.cos(a) * 0.08, 0.1, Math.sin(a) * 0.08), 0.008, M.brass, 6));
}
blob(lantern, M.glow, [0.06, 0.07, 0.06], [0, 0, 0]);
const lampLight = new THREE.PointLight(0xffb050, 2.5, 5, 2);
lantern.add(lampLight);

// ---------------------------------------------------------------- captain capybara
const capy = new THREE.Group();
capy.position.set(0.55, deckY, 0);
ship.add(capy);

blob(capy, M.fur, [0.62, 0.45, 0.45], [0, 0.42, 0], [0, 0, 0.5]);          // body
for (const s of [1, -1]) {
  blob(capy, M.fur, [0.32, 0.26, 0.18], [-0.18, 0.22, s * 0.29]);           // haunches
  blob(capy, M.furDark, [0.16, 0.06, 0.09], [0.06, 0.04, s * 0.32]);        // hind feet
}
blob(capy, M.fur, [0.28, 0.3, 0.28], [0.33, 0.8, 0]);                      // neck

// arms reaching for the helm
for (const s of [1, -1]) {
  const a = V(0.4, 0.62, s * 0.24), b = V(1.28, 0.735, s * 0.18);
  blob(capy, M.fur, [0.11, 0.11, 0.11], [a.x, a.y, a.z]);
  capy.add(rod(a, b, 0.075, M.fur, 14));
  blob(capy, M.furDark, [0.08, 0.07, 0.085], [1.3, 0.735, s * 0.18]);
}

// head (boxy, as capybaras are)
const head = new THREE.Group();
head.position.set(0.6, 1.08, 0);
head.rotation.z = -0.08;
capy.add(head);
head.add(new THREE.Mesh(roundedBox(0.82, 0.46, 0.48, 0.12, 16), M.fur));
const nosePad = new THREE.Mesh(roundedBox(0.05, 0.14, 0.22, 0.02, 6), M.nose);
nosePad.position.set(0.405, 0.03, 0); head.add(nosePad);
for (const s of [1, -1]) {
  blob(head, M.black, [0.012, 0.025, 0.018], [0.43, 0.06, s * 0.06]);       // nostrils
  const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.05, 0.03), M.tooth);
  tooth.position.set(0.41, -0.135, s * 0.017); head.add(tooth);
}
const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.06, 0.01), M.nose);
mouth.position.set(0.412, -0.07, 0); head.add(mouth);

const ears = [];
for (const s of [1, -1]) {
  blob(head, M.black, [0.045, 0.045, 0.045], [0.08, 0.12, s * 0.225]);      // eyes (behind goggles)
  const ear = new THREE.Group(); ear.position.set(-0.3, 0.22, s * 0.17); head.add(ear);
  blob(ear, M.furDark, [0.06, 0.08, 0.045], [0, 0.04, 0], [0, 0, 0.2]);
  ears.push({ g: ear, s });
}

// aviator goggles
function makeLens() {
  const g = new THREE.Group();
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.112, 0.07, 24, 1, true), M.leather);
  cup.rotation.x = Math.PI / 2; g.add(cup);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.022, 12, 32), M.brass);
  rim.position.z = 0.035; g.add(rim);
  const glass = new THREE.Mesh(new THREE.CircleGeometry(0.1, 32), M.glass);
  glass.position.z = 0.03; g.add(glass);
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2;
    blob(g, M.brass, [0.009, 0.009, 0.009], [Math.cos(a) * 0.1, Math.sin(a) * 0.1, 0.056]);
  }
  return g;
}
for (const s of [1, -1]) {
  const lens = makeLens();
  lens.position.set(0.08, 0.12, s * 0.255);
  lens.rotation.y = s > 0 ? 0.45 : Math.PI - 0.45;
  head.add(lens);
}
// leather strap wrapping round the back of the head
const strapPts = [];
const sp = (v, e) => Math.sign(v) * Math.pow(Math.abs(v), e);
for (let i = 0; i <= 48; i++) {
  const t = Math.PI * (0.45 + i / 48 * 1.1);
  strapPts.push(V(0.425 * sp(Math.cos(t), 0.4), 0.12, 0.252 * sp(Math.sin(t), 0.4)));
}
head.add(tube(strapPts, 0.028, M.leather, false, 96));
head.add(tube([V(0.16, 0.16, 0.2), V(0.2, 0.255, 0), V(0.16, 0.16, -0.2)], 0.015, M.brass, false, 24)); // bridge

// scarf
const scarfRing = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.065, 12, 32), M.scarf);
scarfRing.position.set(0.36, 0.83, 0);
scarfRing.quaternion.setFromUnitVectors(V(0, 0, 1), V(0.55, 0.63, 0).normalize());
capy.add(scarfRing);
blob(capy, M.scarf, [0.08, 0.07, 0.07], [0.15, 0.9, 0.02]);
function makeScarfTail(len, width, z, phase) {
  const geo = new THREE.PlaneGeometry(len, width, 24, 2);
  geo.translate(len / 2, 0, 0);
  geo.userData = { base: Float32Array.from(geo.attributes.position.array), len, phase };
  const m = new THREE.Mesh(geo, M.scarf);
  m.position.set(0.15, 0.9, z);
  m.rotation.y = Math.PI;
  capy.add(m);
  return m;
}
const scarfTails = [makeScarfTail(0.95, 0.16, 0.08, 0), makeScarfTail(0.75, 0.14, -0.04, 1.3)];
function updateScarf(m, t) {
  const geo = m.geometry, pos = geo.attributes.position, { base, len, phase } = geo.userData;
  for (let i = 0; i < pos.count; i++) {
    const x = base[i * 3], y = base[i * 3 + 1], k = x / len;
    pos.setXYZ(i, x,
      y - k * k * 0.18 + Math.sin(t * 8 - x * 6 + phase) * 0.03 * k,
      Math.sin(t * 6.5 - x * 5 + phase) * 0.14 * k);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

ship.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

// ---------------------------------------------------------------- clouds
const cloudGeo = new THREE.IcosahedronGeometry(1, 3);
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0x8899aa, emissiveIntensity: 0.25 });
const clouds = [];
const rand = (a, b) => a + Math.random() * (b - a);
function makeCloud() {
  const g = new THREE.Group();
  const n = 5 + Math.floor(Math.random() * 6);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(cloudGeo, cloudMat);
    const s = 1 + Math.random() * 1.8;
    m.scale.set(s * 1.3, s * 0.8, s);
    m.position.set((Math.random() - 0.5) * n * 1.1, Math.random() * 0.8, (Math.random() - 0.5) * 2.5);
    g.add(m);
  }
  return g;
}
function spawnCloud(yMin, yMax, sMin, sMax, spread) {
  const c = makeCloud();
  let x, y, z;
  do { x = rand(-95, 95); y = rand(yMin, yMax); z = rand(-spread, spread); }
  while (Math.abs(z) < 10 && Math.abs(y) < 8);
  c.position.set(x, y, z);
  c.scale.setScalar(rand(sMin, sMax));
  c.userData.speed = rand(2, 4);
  scene.add(c);
  clouds.push(c);
}
for (let i = 0; i < 36; i++) spawnCloud(-18, 14, 0.8, 2.2, 70);   // drifting clouds
for (let i = 0; i < 30; i++) spawnCloud(-30, -24, 2.5, 4.5, 110); // cloud sea below

// ---------------------------------------------------------------- animation
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  ship.position.y = Math.sin(t * 0.8) * 0.25;
  ship.rotation.z = Math.sin(t * 0.6) * 0.035;
  ship.rotation.x = Math.sin(t * 0.45) * 0.03;

  for (const p of props) p.obj.rotation.x += dt * p.speed;
  for (const g of gears) g.mesh.rotation.z += dt * g.speed;
  key.rotation.y -= dt * 0.6;
  needle.rotation.z = -0.6 + Math.sin(t * 2.3) * 0.25 + Math.sin(t * 7) * 0.04;

  wheel.rotation.x = Math.sin(t * 0.7) * 0.22;
  head.rotation.y = Math.sin(t * 0.5) * 0.12;
  head.rotation.x = Math.sin(t * 1.3) * 0.03;
  const flick = Math.pow(Math.max(0, Math.sin(t * 2.1)), 24) * 0.5;
  for (const e of ears) e.g.rotation.x = -e.s * flick;
  for (const s of scarfTails) updateScarf(s, t);
  lampLight.intensity = 2.3 + Math.sin(t * 13) * 0.15 + Math.sin(t * 7.3) * 0.1;

  for (const c of clouds) {
    c.position.x -= c.userData.speed * dt;
    if (c.position.x < -100) c.position.x += 200;
  }

  controls.update();
  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
