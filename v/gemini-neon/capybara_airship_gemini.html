<!--
  Project: S.S. Capybara — Clockwork Wooden Airship (Three.js Single-File)
  AI Model: Gemini
  Engine: Three.js r169 (ES Module ImportMap via jsDelivr CDN) + OrbitControls
  Models Included:
    1. Capybara Pilot (capybaraGroup): Procedural fur, boxy muzzle, serene eyelids, rear ears, brass aviator goggles, 11-segment fluttering crimson scarf
    2. Clockwork Wooden Airship (airshipRoot): Lofted planked gondola, cockpit gauges/throttle/helm/rudder, copper boiler & steam puffs, meshed counter-rotating flank gears (16/10/12T), stern wind-up key, outrigger wooden propellers with blur discs, striped dirigible envelope, tail fins & cross-braced rigging
    3. Golden-Hour Sky & HUD: Custom GLSL sky dome, drifting volumetric clouds, wind streaks, OrbitControls & collapsible brass-and-parchment HUD
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S.S. Capybara — Clockwork Wooden Airship (Three.js)</title>
  <style>
    :root {
      --parchment: #f4e7cb;
      --parchment-dark: #e2cfa6;
      --ink: #2f2014;
      --ink-muted: #654b32;
      --brass-light: #e7c26c;
      --brass-mid: #b88735;
      --brass-dark: #6b4914;
      --burgundy: #7a2626;
      --burgundy-bright: #9f3333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1d2233;
      font-family: "Georgia", "Palatino Linotype", "Book Antiqua", serif;
      color: var(--ink);
      user-select: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
    }

    /* Title Plaque (Top Left) */
    .title-plaque {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      background: linear-gradient(160deg, var(--parchment), var(--parchment-dark));
      border: 2.5px solid var(--brass-mid);
      box-shadow:
        0 8px 24px rgba(18, 10, 4, 0.42),
        inset 0 0 0 2px rgba(255, 245, 220, 0.55),
        inset 0 0 14px rgba(107, 73, 20, 0.22);
      border-radius: 10px;
      padding: 10px 16px;
      pointer-events: none;
    }

    .title-plaque h1 {
      font-size: 1.08rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-plaque .subtitle {
      font-size: 0.74rem;
      letter-spacing: 0.05em;
      color: var(--ink-muted);
      margin-top: 2px;
      font-style: italic;
    }

    .rivet {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--brass-light), var(--brass-dark));
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    }

    /* Brass & Parchment Control HUD (Top Right) */
    .hud {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 12;
      width: 266px;
      background: linear-gradient(170deg, rgba(244, 231, 203, 0.96), rgba(224, 204, 162, 0.95));
      border: 2.5px solid var(--brass-mid);
      border-radius: 12px;
      box-shadow:
        0 10px 30px rgba(15, 8, 2, 0.48),
        inset 0 0 0 2px rgba(255, 247, 224, 0.55),
        inset 0 0 18px rgba(107, 73, 20, 0.2);
      overflow: hidden;
      transition: transform 0.25s ease;
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: linear-gradient(180deg, #4b3118, #331f0e);
      color: var(--parchment);
      border-bottom: 2px solid var(--brass-mid);
      cursor: pointer;
    }

    .hud-header-title {
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .hud-toggle {
      background: transparent;
      border: 1px solid rgba(231, 194, 108, 0.55);
      color: var(--brass-light);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 0.78rem;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s ease, transform 0.25s ease;
    }

    .hud-toggle:hover {
      background: rgba(231, 194, 108, 0.18);
    }

    .hud.collapsed .hud-body {
      display: none;
    }

    .hud.collapsed .hud-toggle {
      transform: rotate(180deg);
    }

    .hud-body {
      padding: 13px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-muted);
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .btn {
      appearance: none;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 8px 11px;
      border-radius: 7px;
      cursor: pointer;
      border: 1.5px solid var(--brass-dark);
      color: var(--ink);
      background: linear-gradient(180deg, #faf1db, #e0cb9e);
      box-shadow: 0 2px 4px rgba(47, 32, 20, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      transition: all 0.16s ease;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn:hover {
      background: linear-gradient(180deg, #fff8e8, #e8d4a6);
      border-color: var(--brass-mid);
      transform: translateY(-1px);
    }

    .btn.active {
      background: linear-gradient(180deg, var(--burgundy-bright), var(--burgundy));
      color: var(--parchment);
      border-color: #4f1414;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35);
    }

    .btn-tag {
      font-size: 0.66rem;
      opacity: 0.78;
      font-style: italic;
      font-weight: 400;
    }

    .slider-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 99px;
      background: linear-gradient(90deg, #5c3d1e, #b88735, #d65a2a);
      border: 1px solid var(--brass-dark);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff0c2, var(--brass-mid) 60%, var(--brass-dark));
      border: 2px solid #3f270c;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff0c2, var(--brass-mid) 60%, var(--brass-dark));
      border: 2px solid #3f270c;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    .telemetry-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 0.72rem;
      background: rgba(65, 42, 18, 0.08);
      border: 1px solid rgba(107, 73, 20, 0.25);
      border-radius: 7px;
      padding: 7px 9px;
    }

    .telemetry-cell strong {
      display: block;
      font-size: 0.85rem;
      color: var(--burgundy);
    }

    .action-row {
      display: flex;
      gap: 8px;
    }

    .btn-primary {
      flex: 1;
      text-align: center;
      justify-content: center;
      background: linear-gradient(180deg, #d7ac56, #a87726);
      color: #231407;
      border-color: #5b3c0e;
    }

    .btn-primary:hover {
      background: linear-gradient(180deg, #e5be6c, #b98630);
    }

    .hint-bar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(34, 22, 12, 0.68);
      color: #f3e4c3;
      border: 1px solid rgba(231, 194, 108, 0.45);
      border-radius: 99px;
      padding: 6px 14px;
      font-size: 0.74rem;
      letter-spacing: 0.04em;
      backdrop-filter: blur(5px);
      pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .title-plaque {
        top: 10px;
        left: 10px;
        padding: 7px 11px;
      }
      .title-plaque h1 { font-size: 0.9rem; }
      .hud {
        top: auto;
        bottom: 42px;
        right: 10px;
        width: 230px;
      }
      .hint-bar {
        font-size: 0.66rem;
        bottom: 8px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="title-plaque">
    <h1><span class="rivet"></span> S.S. Capybara <span class="rivet"></span></h1>
    <div class="subtitle">Clockwork Wooden Dirigible &bull; Capt. Barnaby at the Helm</div>
  </div>

  <aside class="hud" id="hud">
    <div class="hud-header" id="hud-header">
      <span class="hud-header-title"><span class="rivet"></span> Flight Deck</span>
      <button class="hud-toggle" id="hud-toggle" aria-label="Toggle panel">&#9652;</button>
    </div>
    <div class="hud-body">
      <div>
        <div class="section-label"><span>Camera Presets</span><span>1 &ndash; 3</span></div>
        <div class="preset-grid">
          <button class="btn active" data-preset="full">
            <span>Full Airship</span><span class="btn-tag">Quarter View</span>
          </button>
          <button class="btn" data-preset="captain">
            <span>Captain Close-Up</span><span class="btn-tag">Helm &amp; Goggles</span>
          </button>
          <button class="btn" data-preset="clockwork">
            <span>Clockwork Side</span><span class="btn-tag">Meshed Gears</span>
          </button>
        </div>
      </div>

      <div class="slider-wrap">
        <div class="section-label">
          <span>Clockwork Throttle</span>
          <span id="throttle-readout">65%</span>
        </div>
        <input id="throttle-slider" type="range" min="0" max="100" value="65" />
      </div>

      <div class="telemetry-row">
        <div class="telemetry-cell">
          Boiler Pressure
          <strong id="psi-readout">48 PSI</strong>
        </div>
        <div class="telemetry-cell">
          Airspeed
          <strong id="knot-readout">18.2 kt</strong>
        </div>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" id="play-pause-btn">Pause Clockwork</button>
      </div>
    </div>
  </aside>

  <div class="hint-bar">
    Drag to Orbit &bull; Scroll to Zoom &bull; Right-Drag to Pan &bull; Space to Play/Pause
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // 1. RENDERER, SCENE, CAMERA & ORBIT CONTROLS
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xeab57b, 0.0046);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(10.8, 5.2, 13.8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 2.6;
    controls.maxDistance = 42;
    controls.maxPolarAngle = Math.PI * 0.86;
    controls.target.set(0.2, 1.85, 0);
    controls.update();

    // =========================================================================
    // 2. PROCEDURAL TEXTURES (Wood Planks, Capybara Fur, Dirigible Canvas, Gauge)
    // =========================================================================
    function createWoodPlankTexture(baseHex = '#7c4c28', grainHex = '#4f2d14', plankRows = 8) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 512, 512);

      const rowH = 512 / plankRows;
      for (let r = 0; r < plankRows; r++) {
        const y0 = r * rowH;
        const shade = (r % 2 === 0 ? 1 : -1) * (6 + (r * 7) % 12);
        ctx.fillStyle = shade > 0 ? `rgba(255,220,175,${shade / 260})` : `rgba(30,14,4,${-shade / 240})`;
        ctx.fillRect(0, y0, 512, rowH);

        // Fine wood fibers
        ctx.strokeStyle = grainHex;
        for (let i = 0; i < 24; i++) {
          ctx.globalAlpha = 0.08 + Math.random() * 0.14;
          ctx.lineWidth = 0.8 + Math.random() * 1.4;
          ctx.beginPath();
          const gy = y0 + Math.random() * rowH;
          ctx.moveTo(0, gy);
          ctx.bezierCurveTo(170, gy + (Math.random() - 0.5) * 6, 340, gy + (Math.random() - 0.5) * 6, 512, gy);
          ctx.stroke();
        }

        // Plank seam
        ctx.globalAlpha = 0.65;
        ctx.fillStyle = '#2b1608';
        ctx.fillRect(0, y0, 512, 2.2);

        // Vertical butt joint + recessed nail heads
        const jointX = ((r * 173 + 90) % 420) + 46;
        ctx.fillRect(jointX, y0, 2, rowH);
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = '#3a220e';
        ctx.beginPath();
        ctx.arc(jointX - 8, y0 + rowH * 0.28, 2.2, 0, Math.PI * 2);
        ctx.arc(jointX - 8, y0 + rowH * 0.72, 2.2, 0, Math.PI * 2);
        ctx.arc(jointX + 10, y0 + rowH * 0.28, 2.2, 0, Math.PI * 2);
        ctx.arc(jointX + 10, y0 + rowH * 0.72, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createCapybaraFurTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#8d6643');
      grad.addColorStop(0.55, '#7c5636');
      grad.addColorStop(1, '#5d3e24');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // Coarse bristly directional hair strokes
      for (let i = 0; i < 6500; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const len = 6 + Math.random() * 14;
        const palette = ['#a47a52', '#6a472a', '#4d321c', '#b78d62', '#825c3a'];
        ctx.strokeStyle = palette[Math.floor(Math.random() * palette.length)];
        ctx.globalAlpha = 0.28 + Math.random() * 0.32;
        ctx.lineWidth = 0.9 + Math.random() * 1.1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + (Math.random() - 0.5) * 3, y + len);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createEnvelopeTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 512;
      const ctx = c.getContext('2d');

      const stripes = 16;
      const stripeH = 512 / stripes;
      for (let i = 0; i < stripes; i++) {
        const isBurgundy = i % 2 === 1;
        ctx.fillStyle = isBurgundy ? '#7b2525' : '#efe1c1';
        ctx.fillRect(0, i * stripeH, 1024, stripeH);

        // Subtle linen weave
        ctx.fillStyle = isBurgundy ? 'rgba(255,220,190,0.06)' : 'rgba(95,62,30,0.06)';
        for (let k = 0; k < 28; k++) {
          ctx.fillRect(0, i * stripeH + Math.random() * stripeH, 1024, 1);
        }

        // Gore seam piping
        ctx.fillStyle = '#4e2f16';
        ctx.fillRect(0, i * stripeH, 1024, 2);
      }

      // Decorative brass-gold belly band near equator
      ctx.fillStyle = '#c89b44';
      ctx.fillRect(462, 0, 100, 512);
      ctx.fillStyle = '#5c1b1b';
      ctx.fillRect(472, 0, 80, 512);
      ctx.fillStyle = '#e5bf6e';
      ctx.fillRect(472, 0, 6, 512);
      ctx.fillRect(546, 0, 6, 512);

      // Diamond motif on belly band
      ctx.fillStyle = '#e5bf6e';
      for (let y = 16; y < 512; y += 32) {
        ctx.beginPath();
        ctx.moveTo(512, y - 9);
        ctx.lineTo(526, y);
        ctx.lineTo(512, y + 9);
        ctx.lineTo(498, y);
        ctx.closePath();
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createGaugeFaceTexture(label) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#f5e8cc';
      ctx.beginPath();
      ctx.arc(128, 128, 124, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#3c2612';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(128, 128, 114, 0, Math.PI * 2);
      ctx.stroke();

      for (let i = 0; i <= 12; i++) {
        const a = Math.PI * 0.75 + (i / 12) * Math.PI * 1.5;
        const r1 = i % 3 === 0 ? 84 : 94;
        const r2 = 108;
        ctx.strokeStyle = i >= 10 ? '#9e2620' : '#2e1d0e';
        ctx.lineWidth = i % 3 === 0 ? 5 : 2.5;
        ctx.beginPath();
        ctx.moveTo(128 + Math.cos(a) * r1, 128 + Math.sin(a) * r1);
        ctx.lineTo(128 + Math.cos(a) * r2, 128 + Math.sin(a) * r2);
        ctx.stroke();
      }

      ctx.fillStyle = '#3a2410';
      ctx.font = 'bold 26px Georgia';
      ctx.textAlign = 'center';
      ctx.fillText(label, 128, 184);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createPropBlurTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 256, 256);

      const g = ctx.createRadialGradient(128, 128, 10, 128, 128, 124);
      g.addColorStop(0.0, 'rgba(130, 82, 40, 0.05)');
      g.addColorStop(0.35, 'rgba(170, 112, 58, 0.28)');
      g.addColorStop(0.75, 'rgba(218, 165, 92, 0.34)');
      g.addColorStop(0.92, 'rgba(244, 212, 148, 0.45)');
      g.addColorStop(1.0, 'rgba(244, 212, 148, 0.0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(128, 128, 124, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < 6; i++) {
        ctx.strokeStyle = 'rgba(255, 232, 186, 0.28)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(128, 128, 44 + i * 13, i * 0.7, i * 0.7 + 1.8);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Shared PBR Materials
    const woodHullTex = createWoodPlankTexture('#83502b', '#4d2b12', 10);
    woodHullTex.repeat.set(2.4, 1.4);
    const woodDeckTex = createWoodPlankTexture('#9a6439', '#61391b', 12);
    woodDeckTex.repeat.set(2, 2);

    const matHullWood = new THREE.MeshStandardMaterial({
      map: woodHullTex,
      roughness: 0.68,
      metalness: 0.05
    });
    const matDarkTimber = new THREE.MeshStandardMaterial({
      color: 0x4b2b16,
      roughness: 0.72,
      metalness: 0.06
    });
    const matMahogany = new THREE.MeshStandardMaterial({
      color: 0x6c2f1b,
      roughness: 0.44,
      metalness: 0.08
    });
    const matDeckWood = new THREE.MeshStandardMaterial({
      map: woodDeckTex,
      roughness: 0.74,
      metalness: 0.04
    });
    const matBrass = new THREE.MeshStandardMaterial({
      color: 0xd8a84e,
      roughness: 0.28,
      metalness: 0.86
    });
    const matAgedBrass = new THREE.MeshStandardMaterial({
      color: 0x9e7532,
      roughness: 0.42,
      metalness: 0.78
    });
    const matCopper = new THREE.MeshStandardMaterial({
      color: 0xc96c43,
      roughness: 0.3,
      metalness: 0.84
    });
    const matDarkIron = new THREE.MeshStandardMaterial({
      color: 0x35312e,
      roughness: 0.55,
      metalness: 0.72
    });
    const matLeather = new THREE.MeshStandardMaterial({
      color: 0x4b2615,
      roughness: 0.62,
      metalness: 0.08
    });
    const matRope = new THREE.MeshStandardMaterial({
      color: 0xc5a87a,
      roughness: 0.92,
      metalness: 0.0
    });
    const matCanvasFin = new THREE.MeshStandardMaterial({
      color: 0xefe0be,
      roughness: 0.85,

      vertexShader: `
        varying vec3 vWorldDir;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldDir = normalize(position);
          gl_Position = projectionMatrix * viewMatrix * wp;

        uniform vec3 uSunDir;
        uniform vec3 uZenith;
        uniform vec3 uMidSky;
        uniform vec3 uHorizon;
        uniform vec3 uGround;
        varying vec3 vWorldDir;
        void main() {
          vec3 dir = normalize(vWorldDir);
          float h = dir.y;
          vec3 col;
          if (h >= 0.0) {
            float t1 = smoothstep(0.0, 0.24, h);
            float t2 = smoothstep(0.18, 0.78, h);

          float halo = pow(sunDot, 7.0) * 0.48;
          float core = smoothstep(0.9965, 0.9992, sunDot) * 1.45;
          col += vec3(1.0, 0.84, 0.56) * halo + vec3(1.0, 0.96, 0.84) * core;

    // =========================================================================
    // 4. GEOMETRY HELPERS (Symmetrical Involute-Style Meshed Gears & Rigging)
    // =========================================================================
    function createGearMesh(teeth, moduleSize, thickness, hubRadius, spokes, material) {
      const pitchR = (moduleSize * teeth) / 2;
      const addendum = moduleSize * 0.88;
      const dedendum = moduleSize * 1.12;
      const outerR = pitchR + addendum;
      const rootR = Math.max(pitchR - dedendum, hubRadius + 0.05);

      // Tooth 0 is centered symmetrically at angle 0; valley 0 is centered at +0.5 * step
      const shape = new THREE.Shape();
      const step = (Math.PI * 2) / teeth;

      for (let i = 0; i < teeth; i++) {
        const c = i * step;
        const a0 = c - step * 0.25;
        const a1 = c - step * 0.11;
        const a2 = c + step * 0.11;
        const a3 = c + step * 0.25;

        const p0x = Math.cos(a0) * rootR, p0y = Math.sin(a0) * rootR;
        if (i === 0) shape.moveTo(p0x, p0y);
        else shape.lineTo(p0x, p0y);

        shape.lineTo(Math.cos(a1) * outerR, Math.sin(a1) * outerR);
        shape.lineTo(Math.cos(a2) * outerR, Math.sin(a2) * outerR);
        shape.lineTo(Math.cos(a3) * rootR, Math.sin(a3) * rootR);
      }
      shape.closePath();

      // Spoked lightening cutouts
      const holeInner = hubRadius + 0.05;
      const holeOuter = rootR - 0.07;
      if (spokes > 0 && holeOuter > holeInner + 0.05) {
        const sector = (Math.PI * 2) / spokes;
        const pad = 0.22;
        for (let s = 0; s < spokes; s++) {
          const sa0 = s * sector + pad;
          const sa1 = (s + 1) * sector - pad;
          if (sa1 <= sa0 + 0.06) continue;
          const hole = new THREE.Path();
          const segs = 10;
          for (let k = 0; k <= segs; k++) {
            const a = sa0 + (k / segs) * (sa1 - sa0);
            const x = Math.cos(a) * holeOuter;
            const y = Math.sin(a) * holeOuter;
            if (k === 0) hole.moveTo(x, y);
            else hole.lineTo(x, y);
          }
          for (let k = segs; k >= 0; k--) {
            const a = sa0 + (k / segs) * (sa1 - sa0);
            hole.lineTo(Math.cos(a) * holeInner, Math.sin(a) * holeInner);
          }
          hole.closePath();
          shape.holes.push(hole);
        }
      }

      const bore = new THREE.Path();
      bore.absarc(0, 0, hubRadius * 0.42, 0, Math.PI * 2, true);
      shape.holes.push(bore);

      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: thickness,
        bevelEnabled: true,
        bevelThickness: 0.014,
        bevelSize: 0.012,
        bevelSegments: 2,
        curveSegments: 8
      });
      geo.translate(0, 0, -thickness / 2);

      const group = new THREE.Group();
      const gearMesh = new THREE.Mesh(geo, material);
      gearMesh.castShadow = true;
      gearMesh.receiveShadow = true;
      group.add(gearMesh);

      const hub = new THREE.Mesh(
        new THREE.CylinderGeometry(hubRadius, hubRadius * 1.08, thickness * 1.85, 18),
        matAgedBrass
      );
      hub.rotation.x = Math.PI / 2;
      hub.castShadow = true;
      group.add(hub);

      const pin = new THREE.Mesh(
        new THREE.CylinderGeometry(hubRadius * 0.46, hubRadius * 0.46, thickness * 2.4, 14),
        matDarkIron
      );
      pin.rotation.x = Math.PI / 2;
      group.add(pin);

      group.userData = { teeth, pitchR };
      return group;
    }

    function buildLoftedHull() {
      const lenStations = 26;
      const profilePts = 14;
      const halfLen = 3.1;

      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= lenStations; i++) {
        const u = i / lenStations; // 0 = stern (-X), 1 = bow (+X)
        const x = (u * 2 - 1) * halfLen;

        const bowTaper = Math.pow(Math.sin(u * Math.PI), 0.62);
        const beam = 1.18 * bowTaper * (u > 0.5 ? 1.0 - 0.14 * (u - 0.5) : 1.0);
        const depth = 1.05 * Math.pow(Math.sin(u * Math.PI), 0.48) + 0.12;
        const sheerLift = 0.34 * Math.pow(Math.abs(u * 2 - 1), 2.1) + (u > 0.5 ? 0.12 * (u - 0.5) : 0);

        for (let j = 0; j <= profilePts; j++) {
          const v = j / profilePts;
          const angle = (v - 0.5) * Math.PI;
          const z = Math.sin(angle) * beam;
          const y = (1 - Math.cos(angle)) * depth - 0.88 + sheerLift * (1 - Math.cos(angle) * 0.45);

          positions.push(x, y, z);
          uvs.push(u * 2.5, v);
        }
      }

      const stride = profilePts + 1;
      for (let i = 0; i < lenStations; i++) {
        for (let j = 0; j < profilePts; j++) {
          const a = i * stride + j;
          const b = (i + 1) * stride + j;
          const c = (i + 1) * stride + (j + 1);
          const d = i * stride + (j + 1);
          indices.push(a, d, b, b, d, c);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      const outerHull = new THREE.Mesh(geo, matHullWood);
      outerHull.castShadow = true;
      outerHull.receiveShadow = true;

      const innerMat = matDarkTimber.clone();
      innerMat.side = THREE.BackSide;
      const innerHull = new THREE.Mesh(geo, innerMat);
      innerHull.scale.set(0.96, 0.96, 0.93);
      innerHull.receiveShadow = true;

      const hullWrap = new THREE.Group();
      hullWrap.add(outerHull, innerHull);
      return hullWrap;
    }

    // -------------------------------------------------------------------------
    // 5D. MATHEMATICALLY MESHED COUNTER-ROTATING FLANK GEARS & WIND-UP KEY

    const animatedGears = [];
    const gearModule = 0.072;

    // 3-gear train on BOTH port (-Z) and starboard (+Z) flanks
    // Pitch radius r = module * teeth / 2; center distance = r1 + r2
    // Exact tooth-to-valley interlocking phase: phi2 = angle12*(1 + z1/z2) + PI - PI/z2
    const z1 = 16, z2 = 10, z3 = 12;
    const r1 = (gearModule * z1) / 2;
    const r2 = (gearModule * z2) / 2;
    const r3 = (gearModule * z3) / 2;

    const g1Pos = new THREE.Vector2(-0.18, -0.14);
    const angle12 = 0.24;
    const g2Pos = new THREE.Vector2(
      g1Pos.x + Math.cos(angle12) * (r1 + r2 + 0.004),
      g1Pos.y + Math.sin(angle12) * (r1 + r2 + 0.004)
    );
    const angle13 = Math.PI - 0.28;
    const g3Pos = new THREE.Vector2(
      g1Pos.x + Math.cos(angle13) * (r1 + r3 + 0.004),
      g1Pos.y + Math.sin(angle13) * (r1 + r3 + 0.004)
    );

    const phase2 = angle12 * (1 + z1 / z2) + Math.PI - Math.PI / z2;
    const phase3 = angle13 * (1 + z1 / z3) + Math.PI - Math.PI / z3;

    for (const side of [-1, 1]) {
      const zFace = side * 1.24;

      const mountBar = new THREE.Mesh(new THREE.BoxGeometry(2.45, 0.14, 0.08), matAgedBrass);

      gear1.position.set(g1Pos.x, g1Pos.y, zFace);
      gondolaGroup.add(gear1);

      const gear2 = createGearMesh(z2, gearModule, 0.08, 0.10, 5, matCopper);
      gear2.position.set(g2Pos.x, g2Pos.y, zFace);
      gear2.rotation.z = phase2;
      gondolaGroup.add(gear2);

      const gear3 = createGearMesh(z3, gearModule, 0.08, 0.11, 5, matAgedBrass);
      gear3.position.set(g3Pos.x, g3Pos.y, zFace);
      gear3.rotation.z = phase3;
      gondolaGroup.add(gear3);

      animatedGears.push(
        { mesh: gear1, ratio: 1.0, phase: 0 },
        { mesh: gear2, ratio: -(z1 / z2), phase: phase2 },
        { mesh: gear3, ratio: -(z1 / z3), phase: phase3 }

    // -------------------------------------------------------------------------
    // 5F. DIRIGIBLE ENVELOPE, STABILIZING FINS & CROSS-BRACED RIGGING
    // -------------------------------------------------------------------------
    const envelopeGroup = new THREE.Group();

      const fullness = 0.82 + 0.34 * Math.sin(t * Math.PI * 0.85);
      const r = Math.max(0.001, Math.pow(base, 0.66) * envMaxR * fullness);
      lathePts.push(new THREE.Vector2(r, y));

    const envGeo = new THREE.LatheGeometry(lathePts, 32);

    for (const rx of [-2.8, -0.9, 1.0, 2.9]) {

      const fullness = 0.82 + 0.34 * Math.sin(t * Math.PI * 0.85);
      const r = Math.pow(base, 0.66) * envMaxR * fullness + 0.025;
      const ribRing = new THREE.Mesh(new THREE.TorusGeometry(r, 0.032, 8, 36), matAgedBrass);
      ribRing.rotation.y = Math.PI / 2;
      ribRing.position.x = rx;
      envelopeGroup.add(ribRing);

    const finShape = new THREE.Shape();

      arm.castShadow = true;
      capybaraGroup.add(arm);

      const paw = new THREE.Mesh(new THREE.SphereGeometry(0.095, 14, 12), matDarkFur);
      paw.scale.set(1.2, 0.72, 0.95);
      paw.position.set(0.58, 0.12, side * 0.28);
      capybaraGroup.add(paw);
    }

    // -------------------------------------------------------------------------
    // 11-SEGMENT FLUTTERING CRIMSON AVIATOR SCARF
    // -------------------------------------------------------------------------
    const scarfCollar = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.072, 10, 22), matScarf);
    scarfCollar.rotation.x = Math.PI / 2;
    scarfCollar.rotation.y = 0.16;
    scarfCollar.position.set(0.06, 0.56, 0);
    scarfCollar.castShadow = true;
    capybaraGroup.add(scarfCollar);

    const scarfKnot = new THREE.Mesh(new THREE.SphereGeometry(0.095, 12, 10), matScarf);
    scarfKnot.position.set(-0.24, 0.52, -0.14);
    capybaraGroup.add(scarfKnot);

    const scarfSegments = [];
    let parentSeg = capybaraGroup;
    const segLen = 0.145;
    for (let i = 0; i < 11; i++) {
      const segPivot = new THREE.Group();
      if (i === 0) {
        segPivot.position.set(-0.26, 0.52, -0.15);
      } else {
        segPivot.position.set(-segLen, 0, 0);
      }

      const width = 0.16 + (i / 11) * 0.07;
      const piece = new THREE.Mesh(
        new THREE.BoxGeometry(segLen + 0.015, 0.022, width),
        matScarf
      );
      piece.position.x = -segLen * 0.5;
      piece.castShadow = true;
      segPivot.add(piece);

      if (i === 10) {
        for (let f = -2; f <= 2; f++) {
          const tassel = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.015, 0.022), matBrass);
          tassel.position.set(-segLen - 0.03, 0, f * 0.044);
          segPivot.add(tassel);
        }
      }

      parentSeg.add(segPivot);
      scarfSegments.push(segPivot);
      parentSeg = segPivot;
    }

    // =========================================================================
    // 7. DRIFTING VOLUMETRIC GOLDEN-HOUR CLOUDS & WIND STREAKS
    // =========================================================================
    const clouds = [];
    const cloudMat = new THREE.MeshStandardMaterial({
      color: 0xffebd2,
      emissive: 0x6b3a24,
      emissiveIntensity: 0.18,
      roughness: 0.96,
      metalness: 0.0
    });

    function createCloudCluster(scale = 1) {
      const g = new THREE.Group();
      const puffCount = 5 + Math.floor(Math.random() * 4);
      for (let i = 0; i < puffCount; i++) {
        const r = (1.1 + Math.random() * 1.35) * scale;
        const puff = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 2), cloudMat);
        puff.position.set(
          (i - puffCount / 2) * 1.2 * scale + (Math.random() - 0.5) * 0.9 * scale,
          (Math.random() - 0.35) * 0.85 * scale,
          (Math.random() - 0.5) * 1.4 * scale
        );
        puff.scale.set(1.25, 0.72, 1.05);
        g.add(puff);
      }
      return g;
    }

    for (let i = 0; i < 24; i++) {
      const scale = 0.75 + Math.random() * 1.75;
      const cloud = createCloudCluster(scale);
      const sideBias = Math.random() < 0.72 ? (Math.random() < 0.5 ? -1 : 1) : 0;
      cloud.position.set(
        (Math.random() - 0.5) * 110,
        -12 + Math.random() * 24,
        sideBias === 0
          ? (Math.random() - 0.5) * 18
          : sideBias * (13 + Math.random() * 42)
      );
      if (Math.abs(cloud.position.z) < 9 && cloud.position.y > -4 && cloud.position.y < 9) {
        cloud.position.y = -8 - Math.random() * 7;
      }
      cloud.userData = { speed: 1.4 + Math.random() * 2.4 };
      scene.add(cloud);
      clouds.push(cloud);
    }

    const windStreaks = [];
    const streakMat = new THREE.MeshBasicMaterial({
      color: 0xffe6ba,
      transparent: true,
      opacity: 0.24
    });
    for (let i = 0; i < 22; i++) {
      const streak = new THREE.Mesh(
        new THREE.BoxGeometry(2.4 + Math.random() * 3.2, 0.018, 0.018),
        streakMat
      );
      streak.position.set(
        (Math.random() - 0.5) * 48,
        -4 + Math.random() * 13,
        (Math.random() - 0.5) * 26
      );
      streak.userData = { speed: 11 + Math.random() * 9 };
      scene.add(streak);
      windStreaks.push(streak);
    }

    // =========================================================================
    // 8. CAMERA PRESETS & HUD INTERACTIVITY
    // =========================================================================
    const presets = {
      full: {
        pos: new THREE.Vector3(10.8, 5.2, 13.8),
        target: new THREE.Vector3(0.2, 1.85, 0)
      },
      captain: {
        pos: new THREE.Vector3(2.95, 2.25, 2.75),
        target: new THREE.Vector3(0.55, 1.02, 0.0)
      },
      clockwork: {
        pos: new THREE.Vector3(-0.35, 0.55, 6.45),
        target: new THREE.Vector3(-0.25, 0.12, 0.35)
      }
    };

    let camTransition = null;
    const presetButtons = document.querySelectorAll('[data-preset]');

    function activatePreset(key) {
      const p = presets[key];
      if (!p) return;
      camTransition = {
        startPos: camera.position.clone(),
        endPos: p.pos.clone(),
        startTarget: controls.target.clone(),
        endTarget: p.target.clone(),
        t: 0
      };
      presetButtons.forEach(b => b.classList.toggle('active', b.dataset.preset === key));
    }

    presetButtons.forEach(btn => {
      btn.addEventListener('click', () => activatePreset(btn.dataset.preset));
    });

    controls.addEventListener('start', () => {
      camTransition = null;
    });

    let throttle = 0.65;
    let isPlaying = true;

    const throttleSlider = document.getElementById('throttle-slider');
    const throttleReadout = document.getElementById('throttle-readout');
    const psiReadout = document.getElementById('psi-readout');
    const knotReadout = document.getElementById('knot-readout');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const hud = document.getElementById('hud');
    const hudHeader = document.getElementById('hud-header');

    function updateTelemetryUI() {
      const pct = Math.round(throttle * 100);
      throttleReadout.textContent = `${pct}%`;
      psiReadout.textContent = `${Math.round(14 + throttle * 52)} PSI`;
      knotReadout.textContent = `${(throttle * 28.0).toFixed(1)} kt`;
    }

    throttleSlider.addEventListener('input', (e) => {
      throttle = parseFloat(e.target.value) / 100;
      updateTelemetryUI();
    });

    function togglePlayPause() {
      isPlaying = !isPlaying;
      playPauseBtn.textContent = isPlaying ? 'Pause Clockwork' : 'Resume Clockwork';
    }

    playPauseBtn.addEventListener('click', togglePlayPause);
    hudHeader.addEventListener('click', () => hud.classList.toggle('collapsed'));

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      } else if (e.key === '1') {
        activatePreset('full');
      } else if (e.key === '2') {
        activatePreset('captain');
      } else if (e.key === '3') {
        activatePreset('clockwork');
      }
    });

    updateTelemetryUI();

    // =========================================================================
    // 9. ANIMATION LOOP
    // =========================================================================
    const clock = new THREE.Clock();
    let simTime = 0;
    let gearAngle = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (camTransition) {
        camTransition.t = Math.min(1, camTransition.t + dt * 1.85);
        const ease = 1 - Math.pow(1 - camTransition.t, 3);
        camera.position.lerpVectors(camTransition.startPos, camTransition.endPos, ease);
        controls.target.lerpVectors(camTransition.startTarget, camTransition.endTarget, ease);
        if (camTransition.t >= 1) camTransition = null;
      }

      if (isPlaying) {
        simTime += dt;
        const driveRate = 0.25 + throttle * 2.4;
        gearAngle += dt * driveRate;

        // 1. Buoyant Dirigible Bobbing, Roll & Pitch
        airshipRoot.position.y = Math.sin(simTime * 0.95) * 0.24;
        airshipRoot.rotation.z = Math.sin(simTime * 0.72) * 0.028 + (throttle - 0.5) * 0.035;
        airshipRoot.rotation.x = Math.cos(simTime * 0.58) * 0.022;

        // 2. Interlocking Counter-Rotating Flank Gears
        for (const g of animatedGears) {
          g.mesh.rotation.z = g.phase + gearAngle * g.ratio;
        }

        // 3. Stern Brass Wind-Up Key
        windupKeyGroup.rotation.x = gearAngle * 0.42;

        // 4. Outrigger Propellers & Speed-Sensitive Blur Discs
        const propSpin = (1.5 + throttle * 26.0) * dt;
        for (const p of propellers) {
          p.pivot.rotation.x += propSpin * p.dir;
        }
        const blurAlpha = THREE.MathUtils.clamp((throttle - 0.15) * 0.95, 0, 0.72);
        for (const d of blurDiscs) {
          d.material.opacity = blurAlpha;
          d.rotation.x += propSpin * 0.3;
        }

        // 5. Cockpit Helm Wheel, Rudder, Throttle Lever & Gauges
        const steer = Math.sin(simTime * 0.8) * 0.24;
        helmWheel.rotation.z = steer * 1.4;
        rudderPivot.rotation.y = -steer * 0.9;

        const targetLeverAngle = (throttle - 0.5) * -1.2;
        throttleLeverPivot.rotation.z = THREE.MathUtils.lerp(throttleLeverPivot.rotation.z, targetLeverAngle, dt * 6);

        gaugeNeedles[0].rotation.z = -1.9 + throttle * 3.4 + Math.sin(simTime * 6.5) * 0.05;
        gaugeNeedles[1].rotation.z = -0.3 + Math.sin(simTime * 0.95) * 0.22;
        gaugeNeedles[2].rotation.z = -2.1 + throttle * 3.7 + Math.sin(simTime * 3.1) * 0.04;

        // 6. Capybara Subtle Head Look & 11-Segment Fluttering Scarf
        capyHead.rotation.y = Math.sin(simTime * 0.55) * 0.12;
        capyHead.rotation.z = Math.sin(simTime * 1.1) * 0.035;

        const flutterFreq = 4.2 + throttle * 11.5;
        const flutterAmp = 0.06 + throttle * 0.19;
        for (let i = 0; i < scarfSegments.length; i++) {
          const seg = scarfSegments[i];
          const phase = simTime * flutterFreq - i * 0.58;
          const growth = 0.45 + (i / scarfSegments.length) * 1.05;
          seg.rotation.y = Math.sin(phase) * flutterAmp * growth;
          seg.rotation.z = Math.cos(phase * 0.78) * (flutterAmp * 0.52) * growth - (1 - throttle) * 0.055;
        }

        // 7. Copper Boiler Firebox Flicker & Rising Steam Puffs
        const flicker = 1.8 + throttle * 1.4 + Math.sin(simTime * 14.3) * 0.25 + Math.cos(simTime * 9.1) * 0.18;
        matFirebox.emissiveIntensity = flicker;
        boilerGlowLight.intensity = 1.4 + throttle * 1.4 + Math.sin(simTime * 12) * 0.2;

        const steamRate = 0.22 + throttle * 0.58;
        for (const puff of steamPuffs) {
          puff.userData.age = (puff.userData.age + dt * steamRate) % 1;
          const a = puff.userData.age;
          puff.position.set(
            -0.22 - a * (1.2 + throttle * 2.6),
            1.78 + a * 1.55,
            puff.userData.driftZ * a * 2.2
          );
          const s = 0.45 + a * 1.95;
          puff.scale.setScalar(s);
          puff.rotation.y += dt * puff.userData.spin;
          puff.material.opacity = Math.sin(a * Math.PI) * (0.35 + throttle * 0.38);
        }

        // 8. Drifting Golden-Hour Clouds & Wind Streaks
        const worldSpeed = 0.5 + throttle * 4.2;
        for (const c of clouds) {
          c.position.x -= dt * c.userData.speed * worldSpeed * 0.55;
          if (c.position.x < -58) c.position.x = 58;
        }

        for (const w of windStreaks) {
          w.position.x -= dt * w.userData.speed * (0.25 + throttle * 1.25);
          w.material.opacity = 0.06 + throttle * 0.24;
          if (w.position.x < -26) {
            w.position.x = 26;
            w.position.y = -4 + Math.random() * 13;
          }
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
